    <div class="my-4 ">
        <ngx-slick-carousel #slickModal="slick-carousel" class="carousel  " [config]="slideConfig">
            @for (card of cards; track card) {

            <div ngxSlickItem class="mx-4 mb-16 mt-4 service-card h-full">
                <div class="flex flex-col justify-between h-full bg-white hover:shadow-lg p-2 rounded-md group">
                    <img [src]="card.image" class="card-image" alt="Inside Hive's Non-Mathematical Encryption Engine">
                    <div class="flex items-center gap-2 -mt-8 bg-[#FFFFE4] px-4 py-1 rounded-sm text-base w-fit">
                        <p class="text-xs">{{card.date}}</p>
                        <p>&bull;</p>
                        <p class="text-xs">{{card.category}}</p>
                    </div>
                    <div class="py-6">
                        <h1 class="text-xl font-bold group-hover:text-[#FAAD17] transition-colors duration-300">
                            {{card.title}}
                        </h1>
                    </div>
                </div>
            </div>
            }

        </ngx-slick-carousel>

    </div>
    <div class="!m-auto text-center !mt-0">
        <button
            class="bg-black rounded-md text-white px-6 py-3 w-fit hover:bg-[#FAAD17] hover:text-black font-semibold">
            Subscribe to Our Newsletter
        </button>
    </div>

</section>
